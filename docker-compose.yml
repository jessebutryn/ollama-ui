services:
  ollama-ui:
    build: .
    container_name: ollama-ui
    restart: unless-stopped
    # Host networking lets the container reach Ollama and the sd-servers on
    # 127.0.0.1, so none of them has to listen on other interfaces.
    network_mode: host
    environment:
      OLLAMA_URL: http://127.0.0.1:11434
      SD_URL: http://127.0.0.1:7861
      SD_EDIT_URL: http://127.0.0.1:7862
      SD_VIDEO_URL: http://127.0.0.1:7863
      SD_WAN_URL: http://127.0.0.1:7864
      LISTEN_PORT: 3000

  # Ollama serves the chat models. It listens on loopback only, like the
  # sd-servers, so stop any Ollama installed on the host (it uses the same port).
  # The tag is unpinned because new model families often need a newer Ollama.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: host
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot job: pulls the chat models in CHAT_MODELS (space-separated, set in .env) once
  # Ollama is up. Models already pulled are only checked for updates.
  ollama-models:
    image: ollama/ollama:latest
    network_mode: host
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      CHAT_MODELS: ${CHAT_MODELS:-qwen3:8b}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until ollama list >/dev/null 2>&1; do sleep 1; done
        for m in $$CHAT_MODELS; do ollama pull "$$m"; done

  # One-shot job: downloads the image model weights into the `image-models`
  # volume on first run, and skips files that are already there.
  image-models:
    image: curlimages/curl:8.10.1
    user: root
    volumes:
      - image-models:/models
      - ./image-server/fetch-models.sh:/fetch-models.sh:ro
    entrypoint: ["/bin/sh", "/fetch-models.sh"]

  # stable-diffusion.cpp image server running Z-Image-Turbo on the GPU.
  image-server:
    build:
      context: https://github.com/leejet/stable-diffusion.cpp.git#3f8527a46c54ecf4cb4ed6003da8e8982283c73c
      dockerfile: docker/Dockerfile.cuda
      args:
        # Compile CUDA kernels only for this GPU (86 = RTX 30xx). 89 = RTX 40xx, 120 = RTX 50xx.
        CUDA_ARCHITECTURES: ${SD_CUDA_ARCH:-86}
    image: sd-server-cuda:3f8527a
    container_name: image-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      image-models:
        condition: service_completed_successfully
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7861"
      - --diffusion-model
      - /models/z_image_turbo-Q6_K.gguf
      - --llm
      - /models/Qwen3-4B-Instruct-2507-Q8_0.gguf
      - --vae
      - /models/ae.safetensors
      # Z-Image-Turbo is distilled: 8 steps with no CFG.
      - --steps
      - "8"
      - --cfg-scale
      - "1.0"
      - --width
      - "1024"
      - --height
      - "1024"
      - --diffusion-fa
      # ESRGAN models for upscaling attached images.
      - --hires-upscalers-dir
      - /models/upscalers
      # Read weights from the model files only while a job runs and release them
      # afterwards, so an idle server holds neither RAM nor VRAM. That lets all
      # the servers and Ollama share one machine; each job pays a disk read.
      - --params-backend
      - disk
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Second stable-diffusion.cpp server running FLUX.2 klein 9B, which edits an
  # attached image from a text instruction. Same image as image-server.
  edit-server:
    image: sd-server-cuda:3f8527a
    container_name: edit-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      image-models:
        condition: service_completed_successfully
      image-server:
        condition: service_started
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7862"
      - --diffusion-model
      - /models/flux-2-klein-9b-Q8_0.gguf
      - --llm
      - /models/Qwen3-8B-Q6_K.gguf
      - --vae
      - /models/flux2-vae.safetensors
      # Klein is distilled: 4 euler steps with no CFG.
      - --steps
      - "4"
      - --cfg-scale
      - "1.0"
      - --sampling-method
      - euler
      - --diffusion-fa
      # Weights load from disk per job, like image-server.
      - --params-backend
      - disk
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Video is opt-in because of its ~35 GB download. Enable it with
  # COMPOSE_PROFILES=video (e.g. in .env).

  # Downloads the video model weights (~35 GB) separately, so the image servers
  # don't wait on them.
  video-models:
    profiles: [video]
    image: curlimages/curl:8.10.1
    user: root
    volumes:
      - image-models:/models
      - ./image-server/fetch-models.sh:/fetch-models.sh:ro
    entrypoint: ["/bin/sh", "/fetch-models.sh", "video"]

  # Third stable-diffusion.cpp server running LTX-2.3 22B distilled, which
  # generates video with audio from text or from an attached first frame.
  # Same image as image-server.
  video-server:
    profiles: [video]
    image: sd-server-cuda:3f8527a
    container_name: video-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      video-models:
        condition: service_completed_successfully
      image-server:
        condition: service_started
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7863"
      - --diffusion-model
      - /models/ltx/ltx-2.3-22b-distilled-1.1-Q3_K_S.gguf
      - --vae
      - /models/ltx/ltx-2.3-22b-dev_video_vae.safetensors
      - --audio-vae
      - /models/ltx/ltx-2.3-22b-dev_audio_vae.safetensors
      - --llm
      - /models/ltx/gemma-3-12b-it-qat-UD-Q4_K_XL.gguf
      - --embeddings-connectors
      - /models/ltx/ltx-2.3-22b-dev_embeddings_connectors.safetensors
      # The distilled model's fixed 8-step schedule, with no CFG.
      - --steps
      - "8"
      - --sigmas
      - "1.0,0.99375,0.9875,0.98125,0.975,0.909375,0.725,0.421875,0.0"
      - --cfg-scale
      - "1.0"
      - --sampling-method
      - euler
      - --width
      - "1280"
      - --height
      - "720"
      - --video-frames
      - "121"
      - --fps
      - "24"
      - --diffusion-fa
      # Weights load from disk per job, like image-server.
      - --params-backend
      - disk
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Fourth stable-diffusion.cpp server running Wan 2.2 TI2V 5B: video without
  # audio, from text or an attached first frame. Much lighter than LTX.
  wan-server:
    profiles: [video]
    image: sd-server-cuda:3f8527a
    container_name: wan-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      video-models:
        condition: service_completed_successfully
      image-server:
        condition: service_started
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7864"
      - --diffusion-model
      - /models/wan/Wan2.2-TI2V-5B-Q8_0.gguf
      - --vae
      - /models/wan/wan2.2_vae.safetensors
      - --t5xxl
      - /models/wan/umt5-xxl-encoder-Q8_0.gguf
      - --cfg-scale
      - "6.0"
      - --sampling-method
      - euler
      - --flow-shift
      - "3.0"
      # Wan's standard negative prompt (it was trained with a Chinese one).
      - --negative-prompt
      - 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
      - --fps
      - "24"
      - --diffusion-fa
      # Weights load from disk per job, like image-server.
      - --params-backend
      - disk
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  image-models:
  ollama-models:
