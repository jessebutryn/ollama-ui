services:
  ollama-ui:
    build: .
    container_name: ollama-ui
    restart: unless-stopped
    # Host networking lets the container reach Ollama on 127.0.0.1:11434
    # without reconfiguring Ollama to listen on all interfaces.
    network_mode: host
    environment:
      OLLAMA_URL: http://127.0.0.1:11434
      SD_URL: http://127.0.0.1:7861
      SD_EDIT_URL: http://127.0.0.1:7862
      SD_VIDEO_URL: http://127.0.0.1:7863
      LISTEN_PORT: 3000

  # One-shot job: downloads the image model weights into the `image-models`
  # volume on first run, and skips files that are already there.
  image-models:
    image: curlimages/curl:8.10.1
    user: root
    volumes:
      - image-models:/models
      - ./image-server/fetch-models.sh:/fetch-models.sh:ro
    entrypoint: ["/bin/sh", "/fetch-models.sh"]

  # stable-diffusion.cpp image server running Z-Image-Turbo on the GPU.
  image-server:
    build:
      context: https://github.com/leejet/stable-diffusion.cpp.git#3f8527a46c54ecf4cb4ed6003da8e8982283c73c
      dockerfile: docker/Dockerfile.cuda
      args:
        # Compile CUDA kernels only for this GPU (86 = RTX 30xx). 89 = RTX 40xx, 120 = RTX 50xx.
        CUDA_ARCHITECTURES: ${SD_CUDA_ARCH:-86}
    image: sd-server-cuda:3f8527a
    container_name: image-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      image-models:
        condition: service_completed_successfully
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7861"
      - --diffusion-model
      - /models/z_image_turbo-Q6_K.gguf
      - --llm
      - /models/Qwen3-4B-Instruct-2507-Q8_0.gguf
      - --vae
      - /models/ae.safetensors
      # Z-Image-Turbo is distilled: 8 steps with no CFG.
      - --steps
      - "8"
      - --cfg-scale
      - "1.0"
      - --width
      - "1024"
      - --height
      - "1024"
      - --diffusion-fa
      # ESRGAN models for upscaling attached images.
      - --hires-upscalers-dir
      - /models/upscalers
      # Keep weights in system RAM and move them to the GPU only while
      # generating, so the GPU stays free for Ollama the rest of the time.
      - --offload-to-cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Second stable-diffusion.cpp server running FLUX.2 klein 9B, which edits an
  # attached image from a text instruction. Same image as image-server.
  edit-server:
    image: sd-server-cuda:3f8527a
    container_name: edit-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      image-models:
        condition: service_completed_successfully
      image-server:
        condition: service_started
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7862"
      - --diffusion-model
      - /models/flux-2-klein-9b-Q8_0.gguf
      - --llm
      - /models/Qwen3-8B-Q6_K.gguf
      - --vae
      - /models/flux2-vae.safetensors
      # Klein is distilled: 4 euler steps with no CFG.
      - --steps
      - "4"
      - --cfg-scale
      - "1.0"
      - --sampling-method
      - euler
      - --diffusion-fa
      - --offload-to-cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Video is opt-in: its weights take ~26 GB of system RAM on top of the image
  # and edit servers' ~27 GB, more than a 32 GB machine has. Enable it with
  # COMPOSE_PROFILES=video (e.g. in .env) on hosts with the memory for it.

  # Downloads the video model weights (~28 GB) separately, so the image servers
  # don't wait on them.
  video-models:
    profiles: [video]
    image: curlimages/curl:8.10.1
    user: root
    volumes:
      - image-models:/models
      - ./image-server/fetch-models.sh:/fetch-models.sh:ro
    entrypoint: ["/bin/sh", "/fetch-models.sh", "video"]

  # Third stable-diffusion.cpp server running LTX-2.3 22B, which generates video
  # with audio from text or from an attached first frame. Same image as image-server.
  video-server:
    profiles: [video]
    image: sd-server-cuda:3f8527a
    container_name: video-server
    restart: unless-stopped
    network_mode: host
    depends_on:
      video-models:
        condition: service_completed_successfully
      image-server:
        condition: service_started
    volumes:
      - image-models:/models:ro
    entrypoint: ["/sd-server"]
    command:
      - --listen-ip
      - "127.0.0.1"
      - --listen-port
      - "7863"
      - --diffusion-model
      - /models/ltx/ltx-2.3-22b-dev-UD-Q4_K_M.gguf
      - --vae
      - /models/ltx/ltx-2.3-22b-dev_video_vae.safetensors
      - --audio-vae
      - /models/ltx/ltx-2.3-22b-dev_audio_vae.safetensors
      - --llm
      - /models/ltx/gemma-3-12b-it-qat-UD-Q4_K_XL.gguf
      - --embeddings-connectors
      - /models/ltx/ltx-2.3-22b-dev_embeddings_connectors.safetensors
      - --cfg-scale
      - "6.0"
      - --sampling-method
      - euler
      - --width
      - "1280"
      - --height
      - "720"
      - --video-frames
      - "121"
      - --fps
      - "24"
      - --diffusion-fa
      - --offload-to-cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  image-models:
