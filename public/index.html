<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ollama Chat</title>
  <link rel="stylesheet" href="vendor/github-dark.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        New chat
      </button>
      <nav class="chat-list" id="chatList"></nav>
      <div class="sidebar-footer">
        <button class="link-btn" id="settingsBtn">Settings</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        </button>
        <select id="modelSelect" class="model-select" aria-label="Model"></select>
      </header>

      <section class="messages" id="messages">
        <div class="empty" id="empty">
          <h1>What can I help with?</h1>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="attachments" id="attachments"></div>
        <div class="input-row">
          <label class="icon-btn attach-btn" id="attachLabel" title="Attach image">
            <input type="file" id="fileInput" accept="image/*" multiple hidden>
            <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.5l-8.5 8.5a5 5 0 01-7-7L14 5.5a3.5 3.5 0 015 5L10.5 19a2 2 0 01-3-3L15 8.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </label>
          <textarea id="input" rows="1" placeholder="Message Ollama"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
            <svg class="send-icon" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="stop-icon" viewBox="0 0 24 24" width="14" height="14"><rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <p class="hint">Responses are generated locally by Ollama and can be wrong.</p>
      </form>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings">
      <h2>Settings</h2>
      <label>System prompt
        <textarea id="systemPrompt" rows="5" placeholder="You are a helpful assistant."></textarea>
      </label>
      <label>Temperature <span id="tempValue"></span>
        <input type="range" id="temperature" min="0" max="2" step="0.1">
      </label>
      <label class="checkbox">
        <input type="checkbox" id="showThinking"> Show model thinking (for reasoning models)
      </label>
      <label>Image size
        <select id="imageSize">
          <option value="1024x1024">Square (1024 × 1024)</option>
          <option value="1216x832">Landscape (1216 × 832)</option>
          <option value="832x1216">Portrait (832 × 1216)</option>
          <option value="512x512">Small (512 × 512)</option>
        </select>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="freeVram"> Unload chat models before generating images (frees GPU memory)
      </label>
      <div class="dialog-actions">
        <button value="clear" class="danger" id="clearAll" type="button">Delete all chats</button>
        <button value="close">Done</button>
      </div>
    </form>
  </dialog>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
